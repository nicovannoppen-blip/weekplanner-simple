<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<title>❤️Agenda Vannoppekes❤️</title>

<link rel="icon" href="favicon.ico">
<link rel="shortcut icon" href="/favicon.ico">

<link rel="stylesheet" href="style.css">

<style>

#speechOverlay{
    position:fixed;
    top:10px;
    right:10px;
    background:white;
    border:2px solid #4285F4;
    border-radius:8px;
    padding:12px;
    z-index:1000;
    max-width:300px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
    font-size:14px;
    line-height:1.4;
}

/* =========================
   SLAAPVERHAAL
========================= */

#storyOverlay{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.65);

    z-index:5000;

    padding:20px;

    box-sizing:border-box;

    overflow-y:auto;
}

#storyBox{

    max-width:850px;

    margin:20px auto;

    background:#fffdf5;

    border-radius:20px;

    padding:30px 35px;

    box-shadow:0 10px 40px rgba(0,0,0,0.35);

    font-family:Georgia,serif;

}

#storyTitle{

    text-align:center;

    color:#315a9b;

    font-size:32px;

    margin-top:0;

    margin-bottom:10px;

}

#storyDate{

    text-align:center;

    color:#777;

    font-family:Arial,sans-serif;

    margin-bottom:25px;

}

#storyText{

    font-size:19px;

    line-height:1.75;

    color:#292929;

}

#storyText p{

    margin-bottom:18px;

}

.storyButtons{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:10px;

    margin-top:25px;

}

.storyButtons button{

    background:#4285F4;

    color:white;

    font-weight:bold;

}

.storyButtons button.closeStory{

    background:#777;

}

#storyLoading{

    text-align:center;

    font-family:Arial,sans-serif;

    font-size:18px;

    padding:40px;

}

.storyMoon{

    font-size:42px;

    text-align:center;

    margin-bottom:5px;

}

@media(max-width:600px){

    #storyOverlay{

        padding:8px;

    }

    #storyBox{

        padding:20px;

        margin:5px auto;

    }

    #storyTitle{

        font-size:25px;

    }

    #storyText{

        font-size:18px;

        line-height:1.65;

    }

}

@media print{

    body.printStoryMode #storyOverlay{

        display:block !important;

        position:static;

        background:white;

        padding:0;

        overflow:visible;

    }

    body.printStoryMode #storyBox{

        box-shadow:none;

        max-width:none;

        margin:0;

        padding:0;

    }

    body.printStoryMode #storyText{

        font-size:16pt;

        line-height:1.6;

    }

    body.printStoryMode .storyButtons{

        display:none;

    }

    body.printStoryMode header,
    body.printStoryMode #filters,
    body.printStoryMode #agenda,
    body.printStoryMode #popup{

        display:none !important;

    }

}

</style>

</head>

<body>

<header>

<button onclick="login()">🔐 login</button>

<button onclick="logout()">🚪 logout</button>

<button onclick="prev()">⬅ vorige</button>

<button onclick="today()">📅 vandaag</button>

<button onclick="next()">➡ volgende</button>

<button onclick="toggleView()">🗓 dag/week</button>

<button onclick="selectAll()">✅ alles</button>

<button onclick="selectNone()">❌ niets</button>

<button onclick="printWeek()">🖨 print week</button>

<button onclick="showNextEvents()">🔊 afspraken</button>

<!-- NIEUW -->
<button class="storyButton" onclick="makeSleepStory()">
🌙 Maak slaapverhaal voor morgen
</button>

<div id="liveClock" style="font-weight:bold; cursor:pointer;"></div>

</header>


<div id="filters"></div>

<div id="agenda"></div>


<!-- Overlay voor spraaktekst -->

<div id="speechOverlay" style="display:none;"></div>


<!-- =========================
     SLAAPVERHAAL
========================= -->

<div id="storyOverlay">

    <div id="storyBox">

        <div class="storyMoon">
            🌙
        </div>

        <h1 id="storyTitle">
            Het nachtelijke avontuur van Odin en Niel
        </h1>

        <div id="storyDate"></div>

        <div id="storyLoading">
            🌟 De kabouters maken zich klaar voor hun avontuur...
        </div>

        <div id="storyText"></div>

        <div class="storyButtons">

            <button onclick="readSleepStory()">
                🔊 Voorlezen
            </button>

            <button onclick="stopSleepStory()">
                ⏹ Stop
            </button>

            <button onclick="printSleepStory()">
                🖨 Afdrukken
            </button>

            <button class="closeStory" onclick="closeSleepStory()">
                ✖ Sluiten
            </button>

        </div>

    </div>

</div>


<!-- POPUP -->

<div id="popup" class="popup">

    <div class="popupContent">

        <div id="popupText"></div>

        <button onclick="closePopup()">
            OK
        </button>

    </div>

</div>


<script src="config.js"></script>
<script src="script.js"></script>

</body>

</html>
